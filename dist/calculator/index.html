/* Layout: sticky header with month switch; summary tiles, then "how your income was calculated", charts, pool report below */
:root{
  /* Один фирменный образ Trendo: тёмно-синий фон, золото для денег и акцентов, серебро для вспомогательных линий и подписей */
  --bg:#081032; --surface:#0F1A47; --surface-2:#13205A; --ink:#EEF1F8; --muted:#A3ACC6; --line:rgba(201,207,219,.16);
  --accent:#D6B263; --accent-soft:rgba(214,178,99,.14); --gold:#D6B263; --gold-soft:rgba(214,178,99,.14); --neg:#EE8B76;
  --silver:#C9CFDB; --silver-dim:#8E97B2;

  --gold-grad:linear-gradient(135deg,#EDD592 0%,#CFA650 50%,#A9823A 100%);
  --silver-grad:linear-gradient(135deg,#F1F3F8 0%,#BFC6D4 45%,#8D96AC 100%);
  --display:"Montserrat","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(rgba(201,207,219,.10) 1px,transparent 1.4px),radial-gradient(ellipse at 80% -10%,rgba(214,178,99,.10),transparent 55%),radial-gradient(ellipse at 0% 30%,rgba(60,90,200,.18),transparent 60%);background-size:26px 26px,100% 100%,100% 100%;background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--silver);font-weight:600}
.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:48px}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid rgba(214,178,99,.35);box-shadow:0 30px 80px rgba(0,0,0,.45);border-radius:14px;overflow:hidden;display:grid}
.login-head{background:var(--navy);background-image:radial-gradient(circle at 85% 20%,rgba(212,176,98,.18),transparent 55%);padding:26px 28px}
.login-head .brand svg{width:52px;height:52px}.login-head .brand .wm{font-size:1.3rem}.login-head .brand .wm small{font-size:.8rem}
.login-body{padding:24px 28px 28px;display:grid;gap:16px}
.brand{display:flex;align-items:center;gap:10px;color:var(--on-navy);text-decoration:none}
.brand svg{width:34px;height:34px;flex:none}
.brand .wm{font-family:var(--display);font-weight:800;font-size:.95rem;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--brand-gold);display:grid;gap:2px;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand .wm small{font-weight:600;font-size:.62rem;letter-spacing:.04em;text-transform:none;color:var(--silver);-webkit-text-fill-color:var(--silver)}
.field{display:grid;gap:6px}
.field label{font-size:.85rem;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:11px 12px;width:100%}
.btn{border:0;background:var(--gold-grad);color:#0A1238;border-radius:9px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--silver);border:1px solid rgba(201,207,219,.35)}
.err{color:var(--neg);font-size:.88rem;min-height:1.2em}
.hint{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(6,12,42,.92);backdrop-filter:blur(8px);color:var(--on-navy);border-bottom:1px solid rgba(212,176,98,.35)}
header.top select.month{background:var(--navy-2);color:var(--on-navy);border-color:rgba(255,255,255,.18)}
header.top .btn.ghost{color:var(--on-navy);border-color:rgba(255,255,255,.25)}
@media (max-width:520px){header.top .brand .wm small{display:none}}
header.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px}
header.top .spacer{flex:1}
.who{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;font-weight:600}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
select.month{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px}

main{display:grid;gap:28px;padding-block:26px 56px}
.hello{display:grid;gap:6px}
.hello h1{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,3.4vw,2rem);letter-spacing:-.02em}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);position:relative;overflow:hidden;border-radius:12px;padding:16px;display:grid;gap:4px;align-content:start}
.tile .v{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:-.02em;white-space:nowrap}
.tile .s{font-size:.82rem;color:var(--muted)}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:var(--silver-grad);opacity:.7}
.tile.hero::before{background:var(--gold-grad);opacity:1;height:2px}
.tile.hero{background:var(--navy);border-color:rgba(214,178,99,.55);color:var(--on-navy);background-image:radial-gradient(circle at 100% 0,rgba(212,176,98,.22),transparent 60%)}
.tile.hero .v{color:var(--brand-gold)}
.tile.hero .eyebrow,.tile.hero .s{color:inherit;opacity:.82}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.tile .v{font-size:1.12rem}}

.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:linear-gradient(180deg,rgba(19,32,90,.85),rgba(15,26,71,.85));border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:16px;align-content:start;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

/* calculation steps */
.calc{display:grid;gap:0;margin:0;padding:0;list-style:none}
.calc li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px dashed var(--line)}
.calc li:last-child{border-bottom:0}
.calc .n{font-family:var(--display);font-size:.8rem;color:var(--silver-dim)}
.calc .op{color:var(--muted);font-size:.85rem}
.calc .amt{font-weight:600;text-align:right;white-space:nowrap}
.calc li.result .amt{color:var(--accent);font-family:var(--display);font-weight:700;font-size:1.15rem}

/* charts */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.note{font-size:.82rem;color:var(--muted)}

/* share bar */
.share{display:grid;gap:8px}
.share-bar{height:14px;border-radius:7px;background:var(--bg);border:1px solid var(--line);overflow:hidden;display:flex}
.share-bar span{height:100%;background:var(--gold-grad)}

/* pool p&l */
.pl{display:grid;gap:9px}
.pl-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 118px;gap:10px;align-items:center;font-size:.9rem}
.pl-row .bar{height:10px;border-radius:5px;background:var(--bg);position:relative;overflow:hidden}
.pl-row .bar span{position:absolute;top:0;bottom:0;left:0;border-radius:5px;background:var(--silver-grad);opacity:.75}
.pl-row.pos .bar span{background:var(--gold-grad);opacity:1}
.pl-row.total{font-weight:600}
.pl-row .num{text-align:right;white-space:nowrap}
.pl-row.neg .num{color:var(--muted)}
.pl-row.w4{grid-template-columns:minmax(0,170px) minmax(0,1fr) 104px 52px}
.pl-row .pc{text-align:right;white-space:nowrap;color:var(--gold);font-weight:600;font-size:.85rem}
.pl-row.total .pc{color:var(--gold)}
@media (max-width:520px){.pl-row{grid-template-columns:minmax(0,1fr) 108px}.pl-row.w4{grid-template-columns:minmax(0,1fr) 96px 48px}.pl-row .bar{grid-column:1/-1;order:3}}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.name{white-space:normal;min-width:200px;max-width:360px}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--silver-dim);font-weight:600}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
.pos{color:var(--accent)}
footer{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
/* calculator */
.calc-form{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:end}
@media (max-width:760px){.calc-form{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid rgba(201,207,219,.3);background:transparent;color:var(--silver);border-radius:99px;padding:4px 11px;font-size:.82rem;cursor:pointer}
.chip.on,.chip:hover{border-color:var(--gold);color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:10px 8px;cursor:pointer;font-weight:600;font-size:.88rem}
.seg button.on{background:var(--gold-soft);color:var(--gold)}
.field input#calc-amount{font-family:var(--display);font-weight:700;font-size:1.1rem}
.disclaimer{font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.linkbtn{background:none;border:0;color:var(--gold);font-weight:600;cursor:pointer;padding:0;text-align:left}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .35s ease both}@keyframes f{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* public page */
.hero{display:grid;gap:14px;padding-block:20px 6px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4.6vw,2.8rem);line-height:1.12;letter-spacing:-.02em;max-width:20ch}
.hero h1 em{font-style:normal;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{margin:0;color:var(--muted);max-width:62ch;font-size:1.02rem}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:1.35rem}
nav.anchors{display:flex;gap:6px;flex-wrap:wrap}
nav.anchors a{color:var(--silver);text-decoration:none;font-size:.85rem;border:1px solid rgba(201,207,219,.25);border-radius:99px;padding:5px 12px}
nav.anchors a:hover{border-color:var(--gold);color:var(--gold)}
section[id]{scroll-margin-top:84px}
@media (max-width:520px){nav.anchors a:not(:first-child){display:none}}
.month-tabs{display:flex;gap:6px;flex-wrap:wrap}
.month-tabs button{border:1px solid rgba(201,207,219,.25);background:transparent;color:var(--silver);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.85rem}
.month-tabs button.on{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
</style>

const short = n => { const a=Math.abs(n); if(a>=1e6) return (n/1e6).toFixed(a>=1e7?1:2).replace('.',',')+' млн'; if(a>=1e3) return Math.round(n/1e3)+' тыс'; return fmt(n); };

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const prevMonth = m => DATA.months[DATA.months.indexOf(m)-1];
const prevRow = (m,id) => { const pm=prevMonth(m); return pm && rowFor(pm,id); };
const monthGen = m => ({'Январь':'январю','Февраль':'февралю','Март':'марту','Апрель':'апрелю','Май':'маю','Июнь':'июню','Июль':'июлю','Август':'августу','Сентябрь':'сентябрю','Октябрь':'октябрю','Ноябрь':'ноябрю','Декабрь':'декабрю'})[m.label.split(' ')[0]];
const delta = (a,b) => { const d=(a/b-1)*100; return (d>=0?'+':'−')+Math.abs(d).toFixed(1).replace('.',',')+'%'; };

function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const n=raw/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }

function poolBlock(m){
  const p=m.pool;
  const rows=[['Продажи',p.sales,'pos'],['Себестоимость',-p.cogs,'neg'],['Комиссия Kaspi',-p.kaspi,'neg'],['Доставка Kaspi',-p.delivery,'neg'],['Налог 3%',-p.tax,'neg'],['Валовая прибыль',p.gross,'pos total'],['Операционные расходы',-p.expenses,'neg'],['Чистая прибыль',p.net,'pos total']];
  const pl=rows.map(([l,v,c])=>`<div class="pl-row ${c}"><span>${l}</span><div class="bar"><span style="width:${Math.abs(v)/p.sales*100}%"></span></div><span class="num">${v<0?'−':''}${tg(Math.abs(v))}</span></div>`).join('');
  const ex=m.expenses.map(([l,v])=>`<div class="pl-row neg w4"><span>${l}</span><div class="bar"><span style="width:${v/m.expenses[0][1]*100}%"></span></div><span class="num">${tg(v)}</span><span class="pc">${pct(v/p.sales,1)}</span></div>`).join('')
    + `<div class="pl-row w4 total"><span>Итого</span><div class="bar" style="visibility:hidden"></div><span class="num">${tg(p.expenses)}</span><span class="pc">${pct(p.expenses/p.sales,1)}</span></div>`;
  const top=m.top.map(t=>`<tr><td class="name">${esc(t.name)}</td><td>${fmt(t.qty)}</td><td>${tg(t.sales)}</td><td class="pos">${tg(t.profit)}</td><td>${pct(t.profit/t.sales,0)}</td></tr>`).join('');
  return `<section class="grid2 fade">
    <div class="panel"><div class="panel-h"><h2>Результат пула</h2><span class="muted">${m.period}</span></div>
      <div class="pl">${pl}</div>
      ${prevMonth(m)?`<p class="note" style="margin:0">К ${monthGen(prevMonth(m))}: продажи ${delta(p.sales,prevMonth(m).pool.sales)}, чистая прибыль ${delta(p.net,prevMonth(m).pool.net)}.</p>`:''}
      <p class="note">${fmt(m.orders)} заказов, ${fmt(m.returns)} возвратов, ${fmt(p.skus)} товаров с продажами. Рентабельность по чистой прибыли ${pct(p.net/p.sales,1)}.</p></div>
    <div class="panel"><div class="panel-h"><h2>Операционные расходы</h2><span class="muted">% от продаж</span></div><div class="pl">${ex}</div></div>
  </section>
  <section class="panel fade"><div class="panel-h"><h2>Лучшие товары месяца</h2><span class="muted">по прибыли</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Товар</th><th>Продано, шт</th><th>Выручка</th><th>Прибыль</th><th>Маржа</th></tr></thead><tbody>${top}</tbody></table></div></section>`;
}


const RATE = 0.5;
const monthYield = m => RATE * m.periods.reduce((s,p)=>s+p.net/p.capital,0);
const calc = { amount: 1000000, start: DATA.months[0].key, mode: 'reinvest' };
function simulate(){
  const i0 = DATA.months.findIndex(m=>m.key===calc.start);
  let cap = calc.amount, earned = 0; const rows=[];
  for(const m of DATA.months.slice(i0)){
    const y = monthYield(m), inc = cap*y; earned += inc;
    rows.push({m, y, capStart:cap, inc, earned});
    if(calc.mode==='reinvest') cap += inc;
  }
  return {rows, earned, capEnd: calc.mode==='reinvest'?cap:calc.amount};
}
function calcChart(rows){
  const W=640,H=240,L=60,R=12,T=24,B=30;
  const tops=rows.map(r=>calc.amount+r.earned); const hi0=Math.max(...tops);
  const step=niceStep(hi0/4); const hi=Math.ceil(hi0*1.08/step)*step;
  const y=v=>T+(H-T-B)*(1-v/hi); const slots=Math.max(rows.length,4); const bw=Math.min(64,(W-L-R)/slots*.58); const cx=i=>L+(W-L-R)*(i+.5)/slots;
  let g=''; for(let v=0; v<=hi+1; v+=step) g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`;
  const b=rows.map((r,i)=>`<rect x="${cx(i)-bw/2}" y="${y(calc.amount)}" width="${bw}" height="${H-B-y(calc.amount)}" fill="var(--silver-dim)" opacity=".55"/>
    <rect x="${cx(i)-bw/2}" y="${y(calc.amount+r.earned)}" width="${bw}" height="${y(calc.amount)-y(calc.amount+r.earned)}" fill="var(--gold)"/>
    <text x="${cx(i)}" y="${y(calc.amount+r.earned)-7}" text-anchor="middle" style="fill:var(--ink);font-size:11.5px;font-weight:600">+${short(r.earned)}</text>
    <text class="ax" x="${cx(i)}" y="${H-B+17}" text-anchor="middle">${esc(r.m.label.split(' ')[0])}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Рост вложений по месяцам">${g}${b}</svg>`;
}

function drawCalc(){
  const out=document.getElementById('calc-out'); if(!out) return;
  if(calc.amount<100000){ out.innerHTML='<section class="panel"><p class="muted" style="margin:0">Введите сумму от 100 000 ₸.</p></section>'; return; }
  const s=simulate(), n=s.rows.length, roi=s.earned/calc.amount;
  const rows=s.rows.map(r=>`<tr><td>${r.m.label}</td><td>${pct(r.y)}</td><td>${tg(r.capStart)}</td><td class="pos">+${tg(r.inc)}</td><td>${calc.mode==='reinvest'?tg(r.capStart+r.inc):tg(r.earned)+' выплачено'}</td></tr>`).join('');
  out.innerHTML=`<div style="display:grid;gap:28px">
    <section class="tiles fade">
      <div class="tile hero"><span class="eyebrow">Вы бы заработали</span><span class="v">${tg(s.earned)}</span><span class="s">за ${n} мес.</span></div>
      <div class="tile"><span class="eyebrow">${calc.mode==='reinvest'?'Капитал сейчас':'Капитал в пуле'}</span><span class="v">${tg(s.capEnd)}</span><span class="s">вложено ${tg(calc.amount)}</span></div>
      <div class="tile"><span class="eyebrow">Доходность за период</span><span class="v">${pct(roi,1)}</span><span class="s">на вложенную сумму</span></div>
      <div class="tile"><span class="eyebrow">В среднем в месяц</span><span class="v">${pct(s.rows.reduce((a,r)=>a+r.y,0)/n)}</span><span class="s">доходность инвестора</span></div>
    </section>
    <section class="fade" style="display:grid;gap:16px">
      <div class="panel"><div class="panel-h"><h2>Рост вложений</h2><div class="legend"><span><i style="background:var(--silver-dim)"></i>Вложено</span><span><i style="background:var(--gold)"></i>Заработано</span></div></div><div class="chart">${calcChart(s.rows)}</div></div>
      <div class="panel"><div class="panel-h"><h2>По месяцам</h2><span class="muted">${calc.mode==='reinvest'?'с реинвестом':'с ежемесячной выплатой'}</span></div>
        <div class="tbl-wrap"><table><thead><tr><th>Месяц</th><th>Доход­ность</th><th>Капитал</th><th>Доход</th><th>${calc.mode==='reinvest'?'Итог':'Всего'}</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    </section>
    ${typeof PUBLIC!=='undefined'?'':`<section class="panel fade"><h2>Как устроен пул</h2>
      <ol class="calc">
        <li><span class="n">1</span><span>Вы вносите деньги в общий пул<br><span class="op">капитал идёт на закуп товаров для продажи на Kaspi</span></span><span class="amt"></span></li>
        <li><span class="n">2</span><span>Через 25 дней деньги начинают работать<br><span class="op">это время на аналитику товаров, закуп и логистику</span></span><span class="amt">25 дн.</span></li>
        <li><span class="n">3</span><span>Каждый месяц вы получаете долю чистой прибыли<br><span class="op">пропорционально вашему капиталу в пуле, 50% прибыли на вашу долю</span></span><span class="amt">50%</span></li>
        <li><span class="n">4</span><span>Прибыль можно забирать или оставлять в пуле<br><span class="op">реинвест увеличивает капитал и доход следующих месяцев</span></span><span class="amt"></span></li>
      </ol>
      <p class="disclaimer">Расчёт сделан по фактическим результатам пула за прошедшие месяцы и показывает, сколько получил бы инвестор с такой суммой. Прошлая доходность не гарантирует такую же в будущем: результат зависит от продаж и расходов каждого месяца.</p>
    </section>`}</div>`;
}


const state = { user:null };
const PUBLIC = true;
const app = document.getElementById('app');
let detailKey = DATA.months[DATA.months.length-1].key;

function trendChart(){
  const ms=DATA.months, W=680,H=260,L=56,R=52,T=24,B=30;
  const hi0=Math.max(...ms.map(m=>m.pool.sales)); const step=niceStep(hi0/4); const hi=Math.ceil(hi0*1.05/step)*step;
  const ys=Math.max(...ms.map(monthYield))*1.25;
  const y=v=>T+(H-T-B)*(1-v/hi), yy=v=>T+(H-T-B)*(1-v/ys);
  const slot=(W-L-R)/ms.length, bw=Math.min(30,slot*.28), cx=i=>L+slot*(i+.5);
  let g=''; for(let v=0; v<=hi+1; v+=step) g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`;
  const bars=ms.map((m,i)=>`<rect x="${cx(i)-bw-2}" y="${y(m.pool.sales)}" width="${bw}" height="${H-B-y(m.pool.sales)}" rx="3" fill="var(--silver-dim)" opacity=".6"/>
    <rect x="${cx(i)+2}" y="${y(m.pool.net)}" width="${bw}" height="${H-B-y(m.pool.net)}" rx="3" fill="var(--gold)"/>
    <text class="ax" x="${cx(i)}" y="${H-B+18}" text-anchor="middle">${esc(m.label.split(' ')[0])}</text>`).join('');
  const line=ms.map((m,i)=>`${i?'L':'M'}${cx(i)},${yy(monthYield(m))}`).join('');
  const dots=ms.map((m,i)=>`<circle cx="${cx(i)}" cy="${yy(monthYield(m))}" r="4.5" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/>
    <text x="${cx(i)}" y="${yy(monthYield(m))-11}" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:700">${pct(monthYield(m),1)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Продажи, чистая прибыль и доходность инвестора по месяцам">${g}${bars}<path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 4"/>${dots}</svg>`;
}

function render(){
  const ms=DATA.months, last=ms[ms.length-1], first=ms[0];
  const sumSales=ms.reduce((s,m)=>s+m.pool.sales,0), sumNet=ms.reduce((s,m)=>s+m.pool.net,0), sumInv=ms.reduce((s,m)=>s+m.paidToInvestors,0);
  const avgY=ms.reduce((s,m)=>s+monthYield(m),0)/ms.length;
  const GEN={'Январь':'января','Февраль':'февраля','Март':'марта','Апрель':'апреля','Май':'мая','Июнь':'июня','Июль':'июля','Август':'августа','Сентябрь':'сентября','Октябрь':'октября','Ноябрь':'ноября','Декабрь':'декабря'};
  const opts=ms.map(m=>{const [mn,yr]=m.label.split(' '); return `<option value="${m.key}" ${m.key===calc.start?'selected':''}>с ${GEN[mn]||mn} ${yr}</option>`}).join('');
  const presets=[500000,1000000,2000000,5000000,10000000].map(v=>`<button type="button" class="chip ${v===calc.amount?'on':''}" data-v="${v}">${short(v)} ₸</button>`).join('');
  const table=ms.slice().reverse().map(m=>`<tr><td>${m.label}</td><td>${tg(m.pool.sales)}</td><td>${tg(m.pool.gross)}</td><td>${tg(m.pool.expenses)}</td><td class="pos">${tg(m.pool.net)}</td><td>${pct(m.pool.net/m.pool.sales,1)}</td><td><b>${pct(monthYield(m))}</b></td></tr>`).join('');
  const tabs=ms.map(m=>`<button type="button" data-k="${m.key}" class="${m.key===detailKey?'on':''}">${m.label.split(' ')[0]}</button>`).join('');
  app.innerHTML = `<header class="top"><div class="wrap">${BRAND}<span class="spacer"></span>
      <nav class="anchors" aria-label="Разделы"><a href="#calc">Калькулятор</a><a href="#results">Результаты</a><a href="#how">Как это работает</a></nav></div></header>
  <main class="wrap">
    <section class="hero fade"><span class="eyebrow">Инвестиционный пул · e-commerce на Kaspi</span>
      <h1>Ваши деньги работают в товарах, которые <em>уже продаются</em></h1>
      <p>Мы закупаем и продаём товары на Kaspi.kz, а чистую прибыль каждый месяц делим с инвесторами пропорционально их доле в пуле. Ниже фактические результаты пула за ${first.label.toLowerCase()} – ${last.label.toLowerCase()}.</p></section>
    <section class="tiles fade">
      <div class="tile hero"><span class="eyebrow">Доходность инвестора</span><span class="v">${pct(avgY)}</span><span class="s">в среднем в месяц</span></div>
      <div class="tile"><span class="eyebrow">Продажи пула</span><span class="v">${short(sumSales)} ₸</span><span class="s">за ${ms.length} мес.</span></div>
      <div class="tile"><span class="eyebrow">Чистая прибыль</span><span class="v">${short(sumNet)} ₸</span><span class="s">${pct(sumNet/sumSales,1)} от продаж</span></div>
      <div class="tile"><span class="eyebrow">Начислено инвесторам</span><span class="v">${short(sumInv)} ₸</span><span class="s">капитал пула ${short(last.pool.capital)} ₸</span></div>
    </section>

    <section id="calc" class="fade" style="display:grid;gap:16px">
      <div class="sec-h"><h2>Сколько бы вы заработали</h2><span class="muted">по фактической доходности каждого месяца</span></div>
      <div class="panel"><form class="calc-form" id="cf" autocomplete="off">
        <div class="field"><label for="calc-amount">Сумма инвестиций, ₸</label><input id="calc-amount" inputmode="numeric" value="${fmt(calc.amount)}"><div class="chips">${presets}</div></div>
        <div class="field"><label for="calc-start">Если бы вы вошли</label><select id="calc-start">${opts}</select></div>
        <div class="field"><label>Что делать с прибылью</label><div class="seg" role="group"><button type="button" data-mode="reinvest" class="${calc.mode==='reinvest'?'on':''}">Реинвестировать</button><button type="button" data-mode="payout" class="${calc.mode==='payout'?'on':''}">Забирать</button></div></div>
      </form></div>
      <div id="calc-out"></div>
    </section>

    <section id="results" class="fade" style="display:grid;gap:16px">
      <div class="sec-h"><h2>Результаты пула по месяцам</h2></div>
      <div class="panel"><div class="panel-h"><h2>Динамика</h2><div class="legend"><span><i style="background:var(--silver-dim)"></i>Продажи</span><span><i style="background:var(--gold)"></i>Чистая прибыль</span><span><i style="background:var(--ink);height:2px;vertical-align:3px"></i>Доходность инвестора</span></div></div>
        <div class="chart">${trendChart()}</div>
        <div class="tbl-wrap"><table><thead><tr><th>Месяц</th><th>Продажи</th><th>Валовая прибыль</th><th>Расходы</th><th>Чистая прибыль</th><th>Рентаб.</th><th>Инвестору</th></tr></thead><tbody>${table}</tbody></table></div>
        <p class="note" style="margin:0">«Инвестору» — доходность на капитал за месяц: чистая прибыль ÷ капитал пула × 50%.</p></div>
      <div class="sec-h"><h2>Отчёт за месяц</h2><div class="month-tabs" id="tabs">${tabs}</div></div>
      <div id="detail" style="display:grid;gap:16px">${poolBlock(ms.find(m=>m.key===detailKey))}</div>
    </section>

    <section id="how" class="panel fade"><h2>Как это работает</h2>
      <ol class="calc">
        <li><span class="n">1</span><span>Вы вносите деньги в общий пул<br><span class="op">капитал идёт на закуп товаров для продажи на Kaspi</span></span><span class="amt"></span></li>
        <li><span class="n">2</span><span>Через 25 дней деньги начинают работать<br><span class="op">это время на аналитику товаров, закуп и логистику</span></span><span class="amt">25 дн.</span></li>
        <li><span class="n">3</span><span>Каждый месяц вы получаете долю чистой прибыли<br><span class="op">прибыль на вашу долю в пуле делится пополам между вами и управляющими</span></span><span class="amt">50%</span></li>
        <li><span class="n">4</span><span>Прибыль можно забирать или оставлять в пуле<br><span class="op">реинвест увеличивает капитал и доход следующих месяцев</span></span><span class="amt"></span></li>
        <li><span class="n">5</span><span>Личный кабинет с отчётом каждый месяц<br><span class="op">ваш капитал, доля, расчёт дохода, продажи и расходы пула</span></span><span class="amt"></span></li>
      </ol>
      <p class="disclaimer">Все цифры на странице взяты из фактических ежемесячных отчётов пула. Прошлая доходность не гарантирует такую же в будущем: результат зависит от продаж и расходов каждого месяца. Чтобы стать инвестором, свяжитесь с управляющим Trendo Analytics.</p>
    </section>
    <footer>Trendo Analytics · данные за ${first.label.toLowerCase()} – ${last.label.toLowerCase()}. Суммы в тенге.</footer>
  </main>`;
  const amt=document.getElementById('calc-amount');
  amt.oninput=()=>{ const v=parseInt(amt.value.replace(/\D/g,''),10)||0; calc.amount=v; drawCalc(); app.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',+c.dataset.v===v)); };
  amt.onblur=()=>{ amt.value=fmt(calc.amount); };
  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ calc.amount=+c.dataset.v; amt.value=fmt(calc.amount); app.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c)); drawCalc(); });
  document.getElementById('calc-start').onchange=e=>{ calc.start=e.target.value; drawCalc(); };
  app.querySelectorAll('.seg button').forEach(bn=>bn.onclick=()=>{ calc.mode=bn.dataset.mode; app.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===bn)); drawCalc(); });
  app.querySelectorAll('#tabs button').forEach(bn=>bn.onclick=()=>{ detailKey=bn.dataset.k; app.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===bn)); document.getElementById('detail').innerHTML=poolBlock(ms.find(m=>m.key===detailKey)); });
  drawCalc();
}
render();
</script>
