server {
    listen 80;
    server_name _;
    absolute_redirect off;
    charset utf-8;
    root /usr/share/nginx/html;

    # Главная ведёт на страницу для потенциальных инвесторов
    location = / { return 302 /calculator/; }
    location = /cabinet { return 301 /cabinet/; }
    location = /calculator { return 301 /calculator/; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    # Кабинет не индексируется поисковиками
    location /cabinet/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
    }
}
